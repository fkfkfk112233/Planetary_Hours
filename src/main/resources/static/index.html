<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Planetary Hours</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>

    <main class="container">

        <h1>Planetary Hours</h1>

        <p class="description">
            Calculate the planetary hours for a specific date and location.
        </p>

        <!-- ========================= -->
        <!-- 查詢條件 -->
        <!-- ========================= -->

        <section class="search-panel">

            <!-- 日期 -->

            <div class="form-group">

                <label for="date">
                    Date
                </label>

                <input
                    type="date"
                    id="date"
                >

            </div>


            <!-- 地點 -->

            <div class="form-group">

                <label>
                    Location
                </label>

                <div class="location-group">

                    <label>
                        <input
                            type="radio"
                            name="location"
                            value="TAIPEI"
                            checked
                        >
                        台北
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="location"
                            value="NEW_TAIPEI"
                        >
                        新北
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="location"
                            value="TAOYUAN"
                        >
                        桃園
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="location"
                            value="TAICHUNG"
                        >
                        台中
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="location"
                            value="TAINAN"
                        >
                        台南
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="location"
                            value="KAOHSIUNG"
                        >
                        高雄
                    </label>

                </div>

            </div>


            <!-- 查詢按鈕 -->

            <button id="searchButton">
                Calculate
            </button>

        </section>


        <!-- ========================= -->
        <!-- 錯誤訊息 -->
        <!-- ========================= -->

        <div
            id="errorMessage"
            class="error-message"
        ></div>


        <!-- ========================= -->
        <!-- 基本資料 -->
        <!-- ========================= -->

        <section
            id="sunInfo"
            class="sun-info"
        >

            <div>
                <span>Date</span>
                <strong id="resultDate"></strong>
            </div>

            <div>
                <span>Location</span>
                <strong id="resultLocation"></strong>
            </div>

            <div>
                <span>Sunrise</span>
                <strong id="resultSunrise"></strong>
            </div>

            <div>
                <span>Sunset</span>
                <strong id="resultSunset"></strong>
            </div>

        </section>


        <!-- ========================= -->
        <!-- Planetary Hours -->
        <!-- ========================= -->

        <section>

            <h2>Planetary Hours</h2>

            <div
                id="hoursContainer"
                class="hours-container"
            ></div>

        </section>

    </main>


    <script src="/js/app.js"></script>

</body>

</html>
