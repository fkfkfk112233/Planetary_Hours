<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Planetary Hours</title>

<link rel="stylesheet" href="/css/style.css">

</head>

<body>

	<!-- ========================= -->
	<!-- Navbar -->
	<!-- ========================= -->

	<nav class="navbar">

		<div class="navbar-brand">Planetary Hours</div>

		<div class="navbar-links">

			<a href="/"> Home </a> <a href="/planetary-hours.html" class="active">
				Planetary Hours </a> <a href="/activities.html"> Activities </a> <a
				href="/chaldean-order.html"> Chaldean Order </a>

		</div>

	</nav>

	<main class="container">

		<h1>Planetary Hours</h1>

		<p class="description">Calculate the planetary hours for a
			specific date and location.</p>

		<!-- ========================= -->
		<!-- 查詢條件 -->
		<!-- ========================= -->

		<section class="search-panel">

			<!-- 日期 -->

			<div class="form-group">

				<label for="date"> Date </label> <input type="date" id="date">

			</div>


			<!-- 地點 -->

			<div class="form-group">

				<label> Location </label>

				<div class="location-group">

					<label> <input type="radio" name="location" value="TAIPEI"
						checked> 台北
					</label> <label> <input type="radio" name="location"
						value="NEW_TAIPEI"> 新北
					</label> <label> <input type="radio" name="location"
						value="TAOYUAN"> 桃園
					</label> <label> <input type="radio" name="location"
						value="TAICHUNG"> 台中
					</label> <label> <input type="radio" name="location" value="TAINAN">
						台南
					</label> <label> <input type="radio" name="location"
						value="KAOHSIUNG"> 高雄
					</label>

				</div>

			</div>


			<!-- 查詢按鈕 -->

			<button id="searchButton">Calculate</button>

		</section>


		<!-- ========================= -->
		<!-- 錯誤訊息 -->
		<!-- ========================= -->

		<div id="errorMessage" class="error-message"></div>


		<!-- ========================= -->
		<!-- 基本資料 -->
		<!-- ========================= -->

		<section id="sunInfo" class="sun-info">

			<div>
				<span>Date</span> <strong id="resultDate"></strong>
			</div>

			<div>
				<span>Location</span> <strong id="resultLocation"></strong>
			</div>

			<div>
				<span>Sunrise</span> <strong id="resultSunrise"></strong>
			</div>

			<div>
				<span>Sunset</span> <strong id="resultSunset"></strong>
			</div>

		</section>

		<!-- ========================= -->
		<!-- Current Planetary Hour -->
		<!-- ========================= -->

		<section id="currentHourSection" class="current-hour-section">

			<h2>Current Planetary Hour</h2>

			<div id="currentHour" class="current-hour"></div>

			<div id="currentActivities" class="current-activities"></div>

		</section>


		<!-- ========================= -->
		<!-- Planetary Hours -->
		<!-- ========================= -->

		<!-- ========================= -->
		<!-- Day Hours -->
		<!-- ========================= -->

		<section class="hours-section">

			<button class="hours-toggle" data-target="dayHoursContainer">
				<span>Day Hours</span> <span class="toggle-icon">▼</span>
			</button>

			<div id="dayHoursContainer" class="hours-container"></div>

		</section>


		<!-- ========================= -->
		<!-- Night Hours -->
		<!-- ========================= -->

		<section class="hours-section">

			<button class="hours-toggle" data-target="nightHoursContainer">
				<span>Night Hours</span> <span class="toggle-icon">▼</span>
			</button>

			<div id="nightHoursContainer" class="hours-container"></div>

		</section>

	</main>


	<script src="/js/app.js"></script>

</body>

</html>
